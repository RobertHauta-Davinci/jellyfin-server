name: Infrastructure (Terraform)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    env:
      TF_VAR_tenancy_ocid:         ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid:            ${{ secrets.OCI_USER_OCID }}
      TF_VAR_api_key_fingerprint:  ${{ secrets.OCI_API_KEY_FINGERPRINT }}
      TF_VAR_compartment_ocid:     ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_api_private_key_path: /home/runner/.oci/oci_api_key.pem
      TF_VAR_region:               ${{ vars.OCI_REGION }}
      TF_VAR_ssh_public_key_path:  /tmp/ssh_key.pub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OCI API Key
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_API_PRIVATE_KEY_B64 }}" | base64 -d > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Setup SSH Public Key
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ssh_key.pub

      - name: Download Terraform State
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: infra/
        continue-on-error: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Save Terraform State
        if: inputs.action == 'apply' && always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: |
            infra/terraform.tfstate
            infra/terraform.tfstate.backup
          overwrite: true
          retention-days: 90

      - name: Show Outputs
        if: inputs.action == 'apply'
        run: terraform output
