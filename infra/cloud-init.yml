#cloud-config
package_update: true
package_upgrade: false

packages:
  - docker.io
  - docker-compose-plugin
  - fail2ban
  - git
  - iptables-persistent

runcmd:
  # Enable and start Docker
  - systemctl enable --now docker

  # Create jellyfin user with docker access
  - useradd -m -s /bin/bash -G docker,sudo jellyfin
  - echo "jellyfin ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/jellyfin

  # Copy SSH keys to jellyfin user
  - mkdir -p /home/jellyfin/.ssh
  - cp /home/ubuntu/.ssh/authorized_keys /home/jellyfin/.ssh/authorized_keys
  - chown -R jellyfin:jellyfin /home/jellyfin/.ssh
  - chmod 700 /home/jellyfin/.ssh
  - chmod 600 /home/jellyfin/.ssh/authorized_keys

  # Create app directory
  - mkdir -p /opt/jellyfin
  - chown -R jellyfin:jellyfin /opt/jellyfin

  # Format and mount block volume for media
  - |
    DISK=$(lsblk -dno NAME,TYPE | awk '$2=="disk"{print $1}' | tail -1)
    if [ -n "$DISK" ] && [ "$DISK" != "sda" ]; then
      DEVICE="/dev/$DISK"
      if ! blkid "$DEVICE" | grep -q ext4; then
        mkfs.ext4 -L jellyfin-media "$DEVICE"
      fi
      mkdir -p /mnt/media
      echo "LABEL=jellyfin-media /mnt/media ext4 defaults,_netdev,nofail 0 2" >> /etc/fstab
      mount -a
      mkdir -p /mnt/media/movies /mnt/media/tv /mnt/media/music
      chown -R 1000:1000 /mnt/media
    fi

  # Open firewall ports for HTTP/HTTPS (SSH is already open by default)
  - iptables -I INPUT -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 443 -j ACCEPT
  - iptables -I INPUT -p udp --dport 443 -j ACCEPT
  - netfilter-persistent save

  # Enable fail2ban
  - systemctl enable --now fail2ban
