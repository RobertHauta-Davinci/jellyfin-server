# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  jellyfin:
    restart: always
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./transcodes:/transcodes
      - /mnt/media:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=https://${DOMAIN:?Set DOMAIN in .env}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 10G

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env}
      - JELLYSEERR_DOMAIN=${JELLYSEERR_DOMAIN:?Set JELLYSEERR_DOMAIN in .env}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  gluetun:
    restart: always
    volumes:
      - /opt/jellyfin/gluetun:/gluetun
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  qbittorrent:
    restart: always
    volumes:
      - /opt/jellyfin/qbittorrent:/config
      - /mnt/media:/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  flaresolverr:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  prowlarr:
    restart: always
    volumes:
      - /opt/jellyfin/prowlarr:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  radarr:
    restart: always
    volumes:
      - /opt/jellyfin/radarr:/config
      - /mnt/media:/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

  sonarr:
    restart: always
    volumes:
      - /opt/jellyfin/sonarr:/config
      - /mnt/media:/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

  jellyseerr:
    restart: always
    volumes:
      - /opt/jellyfin/jellyseerr:/app/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  duckdns:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  proxy:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
