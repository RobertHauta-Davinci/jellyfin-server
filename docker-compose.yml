services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "${JELLYFIN_UID:-1000}:${JELLYFIN_GID:-1000}"
    ports:
      - "8096:8096/tcp"     # HTTP web interface
      - "7359:7359/udp"     # Client discovery
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${CACHE_PATH:-./cache}:/cache
      - ${TRANSCODE_PATH:-./transcodes}:/transcodes
      - jellyfin-media:/media:ro
    # Uncomment for Intel QSV hardware transcoding on Linux hosts:
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL:-http://localhost:8096}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
      - WEBUI_PORT=8080
    ports:
      - "8080:8080"                                           # Web UI
      - "${TORRENT_PORT:-56789}:${TORRENT_PORT:-56789}"       # Torrent traffic TCP
      - "${TORRENT_PORT:-56789}:${TORRENT_PORT:-56789}/udp"   # Torrent traffic UDP
    volumes:
      - qbittorrent-config:/config
      - arr-media:/media
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    ports:
      - "9696:9696"
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - arr-media:/media
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - arr-media:/media
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - TZ=${TZ:-America/Toronto}
    ports:
      - "5055:5055"
    volumes:
      - jellyseerr-config:/app/config
    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    environment:
      - CLAMAV_NO_CLAMD=false
      - CLAMAV_NO_FRESHCLAM=false
      - CLAMAV_NO_MILTERD=true
    volumes:
      - clamav-db:/var/lib/clamav
      - arr-media:/media:ro
      - ./scripts/clamscan.sh:/scripts/clamscan.sh:ro
    restart: unless-stopped

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
    restart: unless-stopped

volumes:
  jellyfin-media:
    name: ${MEDIA_VOLUME:-jellyfin-media}
  arr-media:
  qbittorrent-config:
  prowlarr-config:
  radarr-config:
  sonarr-config:
  jellyseerr-config:
  clamav-db:
