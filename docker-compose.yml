services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "${JELLYFIN_UID:-1000}:${JELLYFIN_GID:-1000}"
    ports:
      - "8096:8096/tcp"     # HTTP web interface
      - "7359:7359/udp"     # Client discovery
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${CACHE_PATH:-./cache}:/cache
      - ${TRANSCODE_PATH:-./transcodes}:/transcodes
      - jellyfin-media:/media:ro
    devices:
      - /dev/dri:/dev/dri   # Intel QSV hardware transcoding
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL:-http://localhost:8096}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  jellyfin-media:
    name: ${MEDIA_VOLUME:-jellyfin-media}
